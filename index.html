<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>アンダーサーブ放物線シミュレーター</title>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:#263449;background:#000}
*{box-sizing:border-box}body{margin:0;padding:14px}main{max-width:1400px;margin:auto}
.panel{background:#fff;border:1px solid #d5dde7;border-radius:15px;padding:16px;margin-bottom:14px}
h1{font-size:1.2rem;margin:0 0 12px}h2{font-size:1rem;margin:0;font-weight:750}
.controls{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:18px;align-items:center}
.control label{display:flex;justify-content:space-between;gap:8px;font-weight:750;font-size:.94rem;margin-bottom:9px}
output{white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#9ac8ff}
.hint{font-size:.78rem;color:#718096;margin-top:6px}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;margin-top:8px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.actions{display:flex;gap:8px}button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}
.primary{background:#234ee8;color:#fff}.secondary{background:#e2e8f0;color:#243044}
canvas{display:block;width:100%;height:auto;background:#f8fbff;border-radius:10px}
.caption{font-size:.88rem;line-height:1.6;color:#687f9e;margin-top:12px}
@media(max-width:760px){body{padding:7px}.panel{padding:12px}.controls{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.head{align-items:flex-start;flex-wrap:wrap}}
@media(max-width:420px){.controls{grid-template-columns:1fr}}
</style></head><body><main>
<section class="panel">
<div class="controls">
 <div class="control"><label for="speed">初速 <output id="speedOut">12.8 m/s</output></label><input id="speed" type="range" min="4" max="22" step=".2" value="12.8"><div class="hint">時速換算 <b id="kmh">46.1 km/h</b></div></div>
 <div class="control"><label for="angle">打ち出し角度 <output id="angleOut">63°</output></label><input id="angle" type="range" min="2" max="75" step="1" value="63"><div class="hint">水平から上向きの角度</div></div>
 <div class="control"><label for="height">打点の高さ <output id="heightOut">1.25 m</output></label><input id="height" type="range" min=".5" max="2.5" step=".05" value="1.25"><div class="hint">床からボール中心まで</div></div>
 <div class="control"><label>空気抵抗</label><div class="check"><input id="drag" type="checkbox" checked> <span>空気抵抗を計算に入れる</span></div><div class="hint">体育館の無風状態を想定（Cd=0.20）。回転・風は未対応</div></div>
</div></section>
<section class="panel">
<div class="head"><h2>軌道（横から見た図）</h2><div class="actions"><button class="primary" id="play">▶ 再生</button><button class="secondary" id="reset">初期位置へ</button></div></div>
<canvas id="sideView" width="1200" height="500" aria-label="横から見たボールの軌道"></canvas>
<div class="caption">青線：計算した軌道　紫の縦線・丸印：放物線の最高点とサーブ位置からの距離／高さ　赤い破線：ネット（高さ2.24m）　赤い三角▼：アタックライン（6m・12m）の位置。コートはネットまで9m、ネットから相手側エンドラインまで9mとして表示。</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const g=9.81, ballR=.105, netH=2.24, mass=.26, rho=1.2, cd=.20, area=Math.PI*ballR*ballR;
let points=[],playing=false,raf=null,started=null;
function calc(){
 const v=+$('speed').value,ang=+$('angle').value*Math.PI/180,h=+$('height').value,drag=$('drag').checked;
 let x=0,z=h,vx=v*Math.cos(ang),vz=v*Math.sin(ang),t=0,dt=.005;
 points=[{x,z,t}];
 while(z>=ballR&&t<8&&x<30){
  let ax=0,az=-g;
  if(drag){let sp=Math.hypot(vx,vz),k=.5*rho*cd*area/mass;ax=-k*sp*vx;az-=k*sp*vz;}
  vx+=ax*dt;vz+=az*dt;x+=vx*dt;z+=vz*dt;t+=dt;points.push({x,z,t});
 }
 $('speedOut').textContent=v.toFixed(1)+' m/s';$('kmh').textContent=(v*3.6).toFixed(1)+' km/h';
 $('angleOut').textContent=Math.round(ang*180/Math.PI)+'°';$('heightOut').textContent=h.toFixed(2)+' m';
 drawSide();
}
function drawSide(ballT=null){
 const c=$('sideView'),ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,W,H);
 const L=65,R=W-28,T=28,B=H-58, xmax=20,ymax=8;
 const X=x=>L+x/xmax*(R-L),Y=z=>B-z/ymax*(B-T);
 ctx.strokeStyle='#e1e8f1';ctx.lineWidth=1.5;ctx.font='16px system-ui';ctx.fillStyle='#7184a0';
 for(let x=0;x<=20;x+=2){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),B);ctx.stroke();ctx.fillText(x+'m',X(x)-12,B+32);}
 for(let z=0;z<=8;z++){ctx.beginPath();ctx.moveTo(L,Y(z));ctx.lineTo(R,Y(z));ctx.stroke();ctx.fillText(z+'m',10,Y(z)+5);}
 // court floor
 ctx.strokeStyle='#30435d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(0),B);ctx.lineTo(X(18),B);ctx.stroke();
 ctx.setLineDash([7,6]);ctx.strokeStyle='#9aabc0';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(X(18),T);ctx.lineTo(X(18),B);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#3e4d63';ctx.font='16px system-ui';ctx.fillText('サーブ位置',X(0)+7,B-12);ctx.fillText('相手側エンドライン',X(15.1),B-12);
 // Attack-line positions: red downward triangles only at x=6 m and x=12 m
 ctx.fillStyle='#ef4444';
 for(const ax of [6,12]){
  const px=X(ax), py=B-2, s=8;
  ctx.beginPath();ctx.moveTo(px-s,py-s);ctx.lineTo(px+s,py-s);ctx.lineTo(px,py+s);ctx.closePath();ctx.fill();
 }
 // net at 9m
 ctx.setLineDash([8,7]);ctx.strokeStyle='#f04444';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(X(9),Y(0));ctx.lineTo(X(9),Y(netH));ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#ef4444';ctx.fillText('ネット 2.24m',X(9)+10,Y(netH)-8);
 // Mark the trajectory peak and its distance from the server
 const peak=points.reduce((best,p)=>p.z>best.z?p:best,points[0]);
 ctx.setLineDash([4,5]);ctx.strokeStyle='#7c3aed';ctx.lineWidth=2.5;
 ctx.beginPath();ctx.moveTo(X(peak.x),Y(0));ctx.lineTo(X(peak.x),Y(peak.z));ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#7c3aed';ctx.beginPath();ctx.arc(X(peak.x),Y(peak.z),6,0,Math.PI*2);ctx.fill();
 ctx.font='bold 16px system-ui';
 const peakLabel='最高点 '+peak.x.toFixed(1)+'m / '+peak.z.toFixed(1)+'m';
 const labelX=Math.min(Math.max(X(peak.x)+10,L+4),R-190);
 const labelY=Math.max(T+18,Y(peak.z)-14);
 ctx.fillText(peakLabel,labelX,labelY);
 const ni=points.findIndex(p=>p.x>=9);const split=ni<0?points.length-1:ni;
 function path(a,b,color,dash){ctx.beginPath();let started=false;for(let i=a;i<=b&&i<points.length;i++){let p=points[i];if(!started){ctx.moveTo(X(p.x),Y(p.z));started=true;}else ctx.lineTo(X(p.x),Y(p.z));}ctx.strokeStyle=color;ctx.lineWidth=4;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([]);}
 path(0,split,'#2f6bff',[]);
 if(ni>=0)path(split,points.length-1,'#2f6bff',[3,7]);
 const b=ballT===null?points[0]:points.reduce((a,p)=>Math.abs(p.t-ballT)<Math.abs(a.t-ballT)?p:a,points[0]);
 ctx.fillStyle='#f59e0b';ctx.strokeStyle='#9a4c06';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(X(b.x),Y(b.z),6,0,Math.PI*2);ctx.fill();ctx.stroke();
}
function stop(){playing=false;if(raf)cancelAnimationFrame(raf);raf=null;started=null;$('play').textContent='▶ 再生';}
function frame(ts){if(!playing)return;if(started===null)started=ts;const t=(ts-started)/1000;const end=points.at(-1).t;if(t>=end){stop();drawSide();return;}drawSide(t);raf=requestAnimationFrame(frame);}
$('play').addEventListener('click',()=>{if(playing){stop();drawSide();return;}playing=true;started=null;$('play').textContent='⏸ 停止';raf=requestAnimationFrame(frame);});
$('reset').addEventListener('click',()=>{stop();calc();});
['speed','angle','height','drag'].forEach(id=>$(id).addEventListener('input',()=>{stop();calc();}));
calc();
</script></body></html>
